# Fine-tune an LM on the enron text dataset.

dataset_args:
  dataset_path: ../src/pii_leakage/extern/enron
  dataset_mode: undefended
  sample_duplication_rate: 1
  limit_dataset_size: 10000

# privacy_args:
#   lora_dim: 8
#   lora_dropout: 0.05
#   lora_alpha: 16

trainer_args:
  save_steps: 750
  callback_after_n_steps: 750
  num_train_epochs: 10
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  limit_eval_dataset: 100

model_args:
  architecture: meta-llama/Llama-3.2-3B
  pre_trained: True   # Start from a pre-trained checkpoint

ner_args:
  ner: flair
  ner_model: flair/ner-english-ontonotes-large
  anon_token: <MASK>
  anonymize: False

env_args:
  eval_batch_size: 8
